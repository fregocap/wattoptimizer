# Example configuration for `wattopt plan -c examples/athlete.toml`.
# Every key is optional; omitted keys use the defaults in wattoptimizer/athlete.py.

[athlete]
rider_mass = 72.0        # kg
bike_mass = 9.0          # kg incl. bottles
cp = 280.0               # critical power [W]
w_prime = 20000.0        # W' [J]
cda_aero = 0.23          # m^2 on the aero bars
cda_climb = 0.30         # m^2 seated upright
aero_cp_factor = 0.97    # CP on the aero bars relative to upright
crr = 0.004
glycogen = 500.0         # g at the start
cho_intake = 80.0        # g/h absorbed on the bike

[race]
# start_time = 2026-07-12T07:30:00+02:00   # needed for --weather
start_speed = 5.0        # m/s at the mount line
w_prime_final = 0.25     # keep 25% of W' for the run
glycogen_final = 250.0   # g left at T2
temperature = 22.0       # C
climb_grade = 0.05       # sit up above 5% ...
aero_min_speed = 8.0     # ... or below 8 m/s (29 km/h)
