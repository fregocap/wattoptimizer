# Example configuration for `wattopt plan -c examples/athlete.toml`.
# Every key is optional; omitted keys use the defaults in wattoptimizer/athlete.py.

[athlete]
rider_mass = 72.0        # kg
bike_mass = 9.0          # kg incl. bottles
cp = 280.0               # critical power [W]
w_prime = 20000.0        # W' [J]
cda_aero = 0.23          # m^2 on the aero bars
cda_climb = 0.30         # m^2 seated upright
aero_cp_factor = 0.96    # CP on the aero bars relative to upright (makes sitting up worthwhile on climbs)
crr = 0.004
glycogen = 500.0         # g at the start
cho_intake = 80.0        # g/h absorbed on the bike

# Durability: CP and W' decline once enough work has been done. These values are
# illustrative, not measured; set the decays to 0 to switch it off. A 40 km TT does
# about 1000 kJ, so it only matters for long races here.
durability_onset = 1500.0           # kJ of work before the decline starts
durability_cp_decay = 0.05          # CP falls 5% per further 1000 kJ
durability_w_prime_decay = 0.10     # W' falls 10% per further 1000 kJ
durability_power_threshold = 0.0    # W; only work above this power counts (0 = all work)

[race]
# start_time = 2026-07-12T07:30:00+02:00   # needed for --weather
start_speed = 5.0        # m/s at the mount line
w_prime_final = 0.25     # keep 25% of W' for the run
glycogen_final = 250.0   # g left at T2
temperature = 22.0       # C
position_mode = "optimize"   # or "rules": sit up above climb_grade / below aero_min_speed
min_position_run = 300.0     # m, shortest stint in one position
